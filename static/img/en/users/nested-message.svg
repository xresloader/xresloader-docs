<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Nested message mapping</title><desc id="desc">parent.child identifies a field in a nested message.</desc><rect width="1100" height="360" rx="18" fill="#f5f8fc"/><g font-family="Segoe UI,sans-serif" fill="#19324a"><text x="32" y="48" font-size="24" font-weight="700">Nested message mapping</text><rect x="25" y="78" width="1050" height="210" rx="12" fill="#fff" stroke="#b4c7d8"/><g font-family="Consolas,monospace" font-size="17"><text x="45" y="110">Column keys: id | dep_test.id | dep_test.name</text><text x="45" y="146">Input:        10001 | 20001 | Dependency name</text><text x="45" y="182">Protocol: message role_cfg { uint32 id; dep_cfg dep_test; }</text><text x="45" y="218">          message dep_cfg { uint32 id; string name; }</text><text x="45" y="254">Result: dep_test = { id: 20001, name: "Dependency name" }</text></g><text x="32" y="320" font-size="16">Illustration · parent.child identifies a field in a nested message.</text></g></svg>
