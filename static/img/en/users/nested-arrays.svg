<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Repeated fields and nested arrays</title><desc id="desc">Indices start at zero; parent[index].child[index] maps nested repeated fields.</desc><rect width="1100" height="360" rx="18" fill="#f5f8fc"/><g font-family="Segoe UI,sans-serif" fill="#19324a"><text x="32" y="48" font-size="24" font-weight="700">Repeated fields and nested arrays</text><rect x="25" y="78" width="1050" height="210" rx="12" fill="#fff" stroke="#b4c7d8"/><g font-family="Consolas,monospace" font-size="17"><text x="45" y="110">Column keys: arr[0].name | arr[0].int_arr[0] | arr[0].int_arr[1]</text><text x="45" y="146">Input:        First entry | 101 | 102</text><text x="45" y="182">Column keys: arr[1].name | arr[1].int_arr[0] | arr[1].int_arr[1]</text><text x="45" y="218">Input:        Second entry | 201 | 202</text><text x="45" y="254">Result: arr = [{name: "First entry", int_arr: [101,102]}, …]</text></g><text x="32" y="320" font-size="16">Illustration · Indices start at zero; parent[index].child[index] maps nested repeated fields.</text></g></svg>
