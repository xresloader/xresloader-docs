<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">ProtoName and KeyRow</title><desc id="desc">Each key maps a column to the corresponding protocol field.</desc><rect width="1100" height="360" rx="18" fill="#f5f8fc"/><g font-family="Segoe UI,sans-serif" fill="#19324a"><text x="32" y="48" font-size="24" font-weight="700">ProtoName and KeyRow</text><rect x="25" y="78" width="1050" height="210" rx="12" fill="#fff" stroke="#b4c7d8"/><g font-family="Consolas,monospace" font-size="17"><text x="45" y="110">ProtoName = role_upgrade_cfg · KeyRow = 2</text><text x="45" y="146">Description: Character ID | Level | Currency | Cost</text><text x="45" y="182">Row 2 keys: Id | Level | CostType | CostValue</text><text x="45" y="218">Protocol: Id = 1; Level = 2; CostType = 3; CostValue = 4</text><text x="45" y="254">Records begin on row 3.</text></g><text x="32" y="320" font-size="16">Illustration · Each key maps a column to the corresponding protocol field.</text></g></svg>
